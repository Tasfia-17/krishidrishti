[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krishidrishti"
version = "1.0.0"
description = "AI Crop Doctor — Gemma 4 vision-powered crop disease diagnosis. 100% local, 100% private."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agriculture", "ai", "gemma", "crop-disease", "plant-health", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",
    "pillow==11.0.0",
    "python-multipart==0.0.12",
    "pydantic==2.10.3",
    "python-dotenv==1.0.1",
    "aiosqlite==0.20.0",
]

[project.scripts]
krishidrishti = "main:main"

[project.urls]
Homepage = "https://github.com/yourhandle/krishidrishti"
Repository = "https://github.com/yourhandle/krishidrishti"

[tool.hatch.build.targets.wheel]
packages = ["gemma_engine", "storage", "api"]
